name: zhixing

x-backend-env: &backend-env
  TZ: Asia/Shanghai
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?请先运行初始化脚本}
  POSTGRES_USER: ${APP_DB_USER:-zhixing_app}
  POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?请配置应用数据库凭证}
  BUSINESS_DB_USER: ${BUSINESS_DB_USER:-zhixing_business_reader}
  BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:?请配置业务只读数据库凭证}
  REDIS_HOST: redis
  MILVUS_HOST: milvus
  APP_MINIO_ENDPOINT: minio:9000
  APP_MINIO_ACCESS_KEY: ${APP_MINIO_ACCESS_KEY:?请先运行初始化脚本}
  APP_MINIO_SECRET_KEY: ${APP_MINIO_SECRET_KEY:?请先运行初始化脚本}
  APP_MINIO_BUCKET: ${APP_MINIO_BUCKET:-application-files}
  PRIMARY_BASE_URL: ${PRIMARY_BASE_URL:-https://api.deepseek.com}
  PRIMARY_API_KEY: ${PRIMARY_API_KEY:-}
  PRIMARY_MODEL: ${PRIMARY_MODEL:-deepseek-flash}
  FALLBACK_BASE_URL: ${FALLBACK_BASE_URL:-}
  FALLBACK_API_KEY: ${FALLBACK_API_KEY:-}
  FALLBACK_MODEL: ${FALLBACK_MODEL:-qwen-plus}
  PRIMARY_CONTEXT_TOKENS: ${PRIMARY_CONTEXT_TOKENS:-0}
  FALLBACK_CONTEXT_TOKENS: ${FALLBACK_CONTEXT_TOKENS:-0}
  MODEL_OUTPUT_TOKENS: ${MODEL_OUTPUT_TOKENS:-2048}
  MODEL_READ_TIMEOUT_SECONDS: ${MODEL_READ_TIMEOUT_SECONDS:-45}
  MODEL_RETRY_BACKOFF_SECONDS: ${MODEL_RETRY_BACKOFF_SECONDS:-0.5}
  MODEL_CIRCUIT_FAILURES: ${MODEL_CIRCUIT_FAILURES:-3}
  MODEL_CIRCUIT_SECONDS: ${MODEL_CIRCUIT_SECONDS:-30}
  RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-240}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-60}
  KNOWLEDGE_MAX_FILE_BYTES: ${KNOWLEDGE_MAX_FILE_BYTES:-20971520}
  KNOWLEDGE_MAX_BATCH_BYTES: ${KNOWLEDGE_MAX_BATCH_BYTES:-52428800}
  KNOWLEDGE_MAX_FILES: ${KNOWLEDGE_MAX_FILES:-10}
  KNOWLEDGE_PARSE_TIMEOUT_SECONDS: ${KNOWLEDGE_PARSE_TIMEOUT_SECONDS:-30}
  RETRIEVAL_MODEL_URL: http://retrieval-models:8090
  RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-600}
  RAG_CHUNK_OVERLAP: "0"
  RAG_RECALL_LIMIT: ${RAG_RECALL_LIMIT:-20}
  RAG_RERANK_LIMIT: ${RAG_RERANK_LIMIT:-20}
  RAG_FINAL_LIMIT: ${RAG_FINAL_LIMIT:-5}
  RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.3}
  RAG_RRF_K: ${RAG_RRF_K:-60}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  SESSION_HOURS: ${SESSION_HOURS:-24}
  LOGIN_LIMIT_PER_MINUTE: ${LOGIN_LIMIT_PER_MINUTE:-20}

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  milvus:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully
  retrieval-models:
    condition: service_healthy

services:
  # 一次性下载固定模型到持久权重卷；文件哈希一致时不会重复下载。
  models-init:
    image: zhixing-retrieval-models:0.6.1
    build: ./retrieval_models
    user: "0:0"
    command: ["python", "download.py"]
    environment:
      TZ: Asia/Shanghai
      MODEL_DOWNLOAD_ENDPOINT: ${MODEL_DOWNLOAD_ENDPOINT:-https://huggingface.co}
    volumes:
      - retrieval-model-cache:/models
    restart: "no"

  retrieval-models:
    image: zhixing-retrieval-models:0.6.1
    build: ./retrieval_models
    environment:
      TZ: Asia/Shanghai
      MODEL_CPU_THREADS: "2"
    volumes:
      - retrieval-model-cache:/models:ro
    read_only: true
    tmpfs: [/tmp]
    cpus: 2
    mem_limit: 3g
    depends_on:
      models-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready',timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 120s
    restart: unless-stopped

  # 默认开发不启动前端容器；生产时显式启用 production profile。
  web:
    profiles: ["production"]
    build: ./frontend
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/web-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    image: zhixing-backend:0.6.1
    environment: *backend-env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on: *app-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    image: zhixing-backend:0.6.1
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on: *app-dependencies
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # 显式管理任务：外置迁移和种子只读挂载，不在应用启动时自动导入。
  db-admin:
    profiles: ["tools"]
    image: zhixing-backend:0.6.1
    build: ./backend
    entrypoint: ["python", "-m", "app.db_admin"]
    environment:
      TZ: Asia/Shanghai
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-zhixing_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      BUSINESS_DB_USER: ${BUSINESS_DB_USER:-zhixing_business_reader}
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD}
      PRIMARY_BASE_URL: ${PRIMARY_BASE_URL:-https://api.deepseek.com}
      PRIMARY_API_KEY: ${PRIMARY_API_KEY:-}
      PRIMARY_MODEL: ${PRIMARY_MODEL:-deepseek-flash}
      FALLBACK_BASE_URL: ${FALLBACK_BASE_URL:-}
      FALLBACK_API_KEY: ${FALLBACK_API_KEY:-}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-qwen-plus}
      PRIMARY_CONTEXT_TOKENS: ${PRIMARY_CONTEXT_TOKENS:-0}
      FALLBACK_CONTEXT_TOKENS: ${FALLBACK_CONTEXT_TOKENS:-0}
      MODEL_OUTPUT_TOKENS: ${MODEL_OUTPUT_TOKENS:-2048}
      MODEL_READ_TIMEOUT_SECONDS: ${MODEL_READ_TIMEOUT_SECONDS:-45}
      MODEL_RETRY_BACKOFF_SECONDS: ${MODEL_RETRY_BACKOFF_SECONDS:-0.5}
      MODEL_CIRCUIT_FAILURES: ${MODEL_CIRCUIT_FAILURES:-3}
      MODEL_CIRCUIT_SECONDS: ${MODEL_CIRCUIT_SECONDS:-30}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-240}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-60}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_DEMO_PASSWORD: ${INITIAL_DEMO_PASSWORD}
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: ${APP_MINIO_ACCESS_KEY}
      APP_MINIO_SECRET_KEY: ${APP_MINIO_SECRET_KEY}
      APP_MINIO_BUCKET: ${APP_MINIO_BUCKET:-application-files}
    volumes:
      - ./database:/database:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.6-bookworm
    command: ["postgres", "-c", "timezone=Asia/Shanghai", "-c", "log_timezone=Asia/Shanghai"]
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.5-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: doristhirdpartydocker/minio:RELEASE.2024-11-07T00-52-20Z
    pull_policy: never
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 一次性初始化服务：两个 Bucket、两个最小权限身份，成功后退出。
  minio-init:
    # 复用已验证镜像自带的 mc，避免再拉取当前不可用的独立 mc 镜像。
    image: doristhirdpartydocker/minio:RELEASE.2024-11-07T00-52-20Z
    pull_policy: never
    entrypoint: ["/bin/sh", "/bootstrap/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MILVUS_ACCESS_KEY: ${MILVUS_ACCESS_KEY}
      MILVUS_SECRET_KEY: ${MILVUS_SECRET_KEY}
      APP_MINIO_ACCESS_KEY: ${APP_MINIO_ACCESS_KEY}
      APP_MINIO_SECRET_KEY: ${APP_MINIO_SECRET_KEY}
      APP_MINIO_BUCKET: ${APP_MINIO_BUCKET:-application-files}
    volumes:
      - ./scripts/minio:/bootstrap:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  milvus:
    image: milvusdb/milvus:v2.5.21
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: ${MILVUS_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_SECRET_KEY}
      MINIO_BUCKET_NAME: milvus-data
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      start_period: 90s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  default:
    name: zhixing-network

volumes:
  retrieval-model-cache:
  postgres-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
